inherits = "term16_dark"

"diagnostic.error"   = { underline = { color = "#ff5555", style = "curl" } }
"diagnostic.warning" = { underline = { color = "#ffcc00", style = "curl" } }
"diagnostic.info"    = { underline = { color = "#5599ff", style = "curl" } }
"diagnostic.hint"    = { underline = { color = "#55cc55", style = "curl" } }

"error"   = { fg = "#ff5555" }
"warning" = { fg = "#ffcc00" }
