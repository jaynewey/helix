[[language]]
name = "python"
language-servers = ["ruff", "ty"]
auto-format = true
formatter = { command = "ruff", args = ["format", "-"] }

[language-server.ruff]
command = "uvx"
args = ["ruff", "server"]

[language-server.ty]
command = "uvx"
args = ["ty", "server"]

[[language]]
name = "typescript"
language-servers = ["oxlint-language-server"]
auto-format = true
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "tsx"
language-servers = ["oxlint-language-server"]
auto-format = true
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }

[language-server.oxlint-language-server]
command = "oxlint"
args = ["--type-aware", "--lsp"]
